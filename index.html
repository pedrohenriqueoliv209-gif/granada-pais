<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globo 3D - Granada</title>

<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
}

#globeViz{
    width:100vw;
    height:100vh;
}

.info{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-family:Arial;
    font-size:18px;
    background:rgba(0,0,0,.6);
    padding:12px 18px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="info">
🌍 Clique no ponto vermelho em <b>Granada</b>.
</div>

<div id="globeViz"></div>

<script>

const grenada = [{
  lat:12.1165,
  lng:-61.6790,
  name:"Grenada"
}];

const globe = Globe()
(document.getElementById('globeViz'))

.globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')

.bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')

.backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')

.pointsData(grenada)

.pointColor(()=>'red')

.pointAltitude(0.05)

.pointRadius(0.6)

.onPointClick(()=>{
    window.open("https://granada-pais.vercel.app/k.html","_blank");
});

// câmera apontando para Granada
globe.pointOfView({
    lat:12.1165,
    lng:-61.6790,
    altitude:1.6
},2000);

// rotação automática
globe.controls().autoRotate=true;
globe.controls().autoRotateSpeed=0.35;

// brilho ambiente
const ambient=new THREE.AmbientLight(0xffffff,1.3);
globe.scene().add(ambient);

// luz do sol
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,3,5);
globe.scene().add(sun);

// halo luminoso em Granada
globe.ringsData(grenada)
.ringColor(()=> 'rgba(255,0,0,0.9)')
.ringMaxRadius(3)
.ringPropagationSpeed(1.5)
.ringRepeatPeriod(1200);

</script>

</body>
</html>
